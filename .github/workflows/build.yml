name: Build TikTok Bot Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        shell: bash
        run: |
          test -f app.py
          test -f requirements.txt

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create distribution package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/tiktok-bot

          cp app.py requirements.txt dist/tiktok-bot/

          if [ -d templates ]; then
            cp -r templates dist/tiktok-bot/
          fi

          if [ -f database.py ]; then
            cp database.py dist/tiktok-bot/
          fi

          cat > dist/tiktok-bot/install.sh <<'EOF'
          #!/bin/bash
          set -e

          python3 -m venv venv
          source venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          echo "Installation complete."
          echo "Start the bot with:"
          echo "./start-bot.sh"
          EOF

          cat > dist/tiktok-bot/start-bot.sh <<'EOF'
          #!/bin/bash
          set -e

          source venv/bin/activate
          python app.py
          EOF

          chmod +x dist/tiktok-bot/install.sh
          chmod +x dist/tiktok-bot/start-bot.sh

          cat > dist/tiktok-bot/README.txt <<'EOF'
          TIKTOK BOT
          ==========
          
          1. Extract tiktok-bot.zip.
          2. Enter the extracted folder.
          3. Run: bash install.sh
          4. Run: ./start-bot.sh
          5. Open: http://localhost:5000
          EOF

          cd dist
          zip -r tiktok-bot.zip tiktok-bot

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot
          path: dist/tiktok-bot.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tiktok-bot.zip
          tag_name: v1.0.${{ github.run_number }}
          name: TikTok Bot v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}