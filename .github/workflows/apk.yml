name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 2. Add build-tools directory to PATH
      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lib32stdc++6 lib32z1

      # ✅ 3. PIN PIP, SETUPTOOLS, AND BUILD TOOLS to prevent the open_rich_spinner error
      - name: Install build tools
        run: |
          python -m pip install --user --upgrade pip==23.3.2 setuptools==69.5.1 wheel==0.43.0
          python -m pip install --user buildozer==1.5.0 cython==3.0.12

      # ✅ 4. Changed cache key to v5 to force a completely clean build environment
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-v5-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: echo y | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot-apk
          path: bin/*.apk
          if-no-files-found: error