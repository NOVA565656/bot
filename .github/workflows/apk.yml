name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 2. Add build-tools directory to PATH
      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lib32stdc++6 lib32z1

      # ✅ 3. SET UP VIRTUAL ENVIRONMENT (Isolates pip and fixes the conflict)
      - name: Set up build environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip==23.3.2 setuptools==69.5.1 wheel==0.43.0
          python -m pip install buildozer==1.5.0 cython==3.0.12

      # 4. Cache buildozer (Bumped to v6 to force a clean slate)
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-v6-${{ hashFiles('buildozer.spec') }}

      # ✅ 5. BUILD WITH PYTHONNOUSERSITE
      - name: Build
        env:
          PYTHONNOUSERSITE: "1" # Tells Python to ignore the ~/.local folder entirely
        run: |
          . .venv/bin/activate
          unset PYTHONPATH
          echo y | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot-apk
          path: bin/*.apk
          if-no-files-found: error