name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1. Remove any conflicting system-wide aidl packages
      - name: Remove system aidl packages
        run: |
          sudo apt-get remove -y aidl || true
          sudo apt-get autoremove -y || true

      # 2. Install the required Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 3. Add the build-tools directory to PATH
      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH

      # 4. Verify aidl is the correct one (check the path and a safe command)
      - name: Verify aidl
        run: |
          which aidl
          # Use --help instead of --version to check it runs
          aidl --help > /dev/null
          echo "aidl is working correctly"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lib32stdc++6 lib32z1

      - name: Install buildozer
        run: pip install --user buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: echo y | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot-apk
          path: bin/*.apk
          if-no-files-found: error