name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lib32stdc++6 lib32z1
          sudo apt-get install -y aidl || echo "aidl missing from apt, using sdkmanager"

      - name: Ensure aidl on PATH
        run: |
          if ! command -v aidl >/dev/null 2>&1; then
            SDK=/usr/local/lib/android/sdk
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;33.0.2" >/dev/null || true
            FOUND=$(find "$SDK" -name aidl -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              sudo cp "$FOUND" /usr/local/bin/aidl
              sudo chmod +x /usr/local/bin/aidl
            fi
          fi
          aidl --version

      - name: Install buildozer
        run: pip install --user buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot-apk
          path: bin/*.apk
          if-no-files-found: error