name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1. Properly set up the Android SDK
      - uses: android-actions/setup-android@v3

      # 2. Install Build-Tools (where the correct aidl lives) and accept licenses
      - name: Install Build-Tools and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33"

      # 3. Add the build-tools directory to PATH so aidl is globally available
      - name: Add build-tools to PATH
        run: echo "$ANDROID_SDK_ROOT/build-tools/33.0.2" >> $GITHUB_PATH

      # 4. Verify aidl is correctly found
      - name: Verify aidl
        run: which aidl && aidl --version

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lib32stdc++6 lib32z1

      - name: Install buildozer
        run: pip install --user buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}

      - name: Build
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-bot-apk
          path: bin/*.apk
          if-no-files-found: error